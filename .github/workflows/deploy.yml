name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read    # checkout only
  pages: write      # enable / configure GitHub Pages
  id-token: write   # required by actions/deploy-pages for OIDC

# Allow only one concurrent deployment; do not cancel in-progress so a
# partially-deployed release is never left in an inconsistent state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── Gate: type-check ────────────────────────────────────────────────────────
  lint:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npm run check

  # ── Gate: unit tests ────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ── Build & upload Pages artifact ───────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Reference the production environment so the job can access
    # GOOGLE_CLIENT_EMAIL, GOOGLE_PRIVATE_KEY, and GOOGLE_SPREADSHEET_ID
    # configured in Settings → Environments → production.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Configure GitHub Pages (switches source to GitHub Actions mode so the
      # deploy-pages action can publish the artifact; also provides base_path).
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # prebuild runs fetch-i18n (Google Sheets → src/locales/) then
      # fetch-projects (GitHub API → src/data/projects-generated.json).
      # Both scripts are CI-aware: fetch-projects always refreshes (CI=true),
      # and fetch-i18n exits with an error if credentials are missing in CI.
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # ── Deploy to GitHub Pages ───────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

