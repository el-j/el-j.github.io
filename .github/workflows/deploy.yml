name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # push production build to gh-pages branch
  pages: write      # configure Pages source via API
  pull-requests: write

# Allow only one concurrent deployment; do not cancel in-progress so a
# partially-deployed release is never left in an inconsistent state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── Gate: type-check ────────────────────────────────────────────────────────
  lint:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npm run check

  # ── Gate: unit tests ────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ── Build & upload Pages artifact ───────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Reference the production environment so the job can access
    # GOOGLE_CLIENT_EMAIL, GOOGLE_PRIVATE_KEY, and GOOGLE_SPREADSHEET_ID
    # configured in Settings → Environments → production.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # prebuild runs fetch-i18n (Google Sheets → src/locales/) then
      # fetch-projects (GitHub API → src/data/projects-generated.json).
      # Both scripts are CI-aware: fetch-projects always refreshes (CI=true),
      # and fetch-i18n exits with an error if credentials are missing in CI.
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ./dist
          retention-days: 1

  # ── Deploy to gh-pages branch ────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: https://el-j.github.io/
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./dist

      # Switch GitHub Pages to serve from the gh-pages branch so that both
      # the production build (root) and PR previews (preview/pr-N/) coexist
      # on the same branch and are accessible under el-j.github.io/.
      - name: Configure GitHub Pages source to gh-pages branch
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.updateInformationAboutPagesSite({
                owner: context.repo.owner,
                repo: context.repo.repo,
                build_type: 'legacy',
                source: { branch: 'gh-pages', path: '/' },
              });
              console.log('Pages source configured: gh-pages branch / root');
            } catch (err) {
              // Already set, or insufficient scope — either way non-fatal.
              console.warn(`Could not update Pages source (may already be correct): ${err.message}`);
            }

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # keep_files preserves preview/pr-N/ subdirectories written by the
          # PR preview workflow so that live previews are not wiped on every
          # production deploy.
          keep_files: true

