name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # fetch-projects uses GITHUB_TOKEN for higher API rate limits.
      # fetch-i18n gracefully skips when GOOGLE_* vars are absent (no
      # production environment secrets are available in PR context).
      - name: Fetch projects
        run: npm run fetch-projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Vite build — validates the entire production pipeline except i18n
      # (locale files already committed as fallback serve that purpose here).
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      # Unit + component smoke tests
      - name: Test
        run: npm test
