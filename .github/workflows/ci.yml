name: CI

on:
  pull_request:
    branches: [main]

jobs:
  # ── Type-check ──────────────────────────────────────────────────────────────
  lint:
    name: Type-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npm run check

  # ── Unit tests + coverage ───────────────────────────────────────────────────
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Post coverage summary comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summaryPath = 'coverage/coverage-summary.json';
            if (!fs.existsSync(summaryPath)) {
              console.log('No coverage summary found, skipping comment');
              return;
            }
            const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
            const t = summary.total;
            const pct = (v) => `${v.pct.toFixed(1)}%`;
            const icon = (v) => v.pct >= 80 ? '🟢' : v.pct >= 50 ? '🟡' : '🔴';
            const body = [
              '## 📊 Coverage Report',
              '',
              '| Metric | Coverage |',
              '|--------|----------|',
              `| ${icon(t.statements)} Statements | ${pct(t.statements)} (${t.statements.covered}/${t.statements.total}) |`,
              `| ${icon(t.branches)} Branches | ${pct(t.branches)} (${t.branches.covered}/${t.branches.total}) |`,
              `| ${icon(t.functions)} Functions | ${pct(t.functions)} (${t.functions.covered}/${t.functions.total}) |`,
              `| ${icon(t.lines)} Lines | ${pct(t.lines)} (${t.lines.covered}/${t.lines.total}) |`,
              '',
              `> Full HTML report available as a [workflow artifact](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith('## 📊 Coverage Report'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ── Build check ─────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # fetch-projects uses GITHUB_TOKEN for higher API rate limits.
      # fetch-i18n gracefully skips when GOOGLE_* vars are absent (no
      # production environment secrets are available in PR context).
      - name: Fetch projects
        run: npm run fetch-projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ── E2E Tests ───────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Run E2E tests
        run: npm run e2e
        env:
          CI: true

      - name: Upload E2E screenshots (baseline)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/screenshots/
          retention-days: 14

      - name: Upload E2E diff screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diff-screenshots
          path: test-results/
          retention-days: 7

      - name: Post E2E diff comment on PR
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## 📸 E2E Visual Diff Detected',
              '',
              'Screenshots have changed. Please review the diffs in the',
              `[workflow artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).`,
              '',
              'If the changes are **intentional**, run the following locally and commit the updated screenshots:',
              '',
              '```bash',
              'npm run e2e:update',
              '```',
              '',
              '> ⚠️ This PR cannot be merged until the E2E job passes.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith('## 📸 E2E Visual Diff'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
